# Minimal config for function deploy flags. Project is linked via CLI.

[functions.sweep-stuck-cases]
# Auth is enforced inside the function (service role = all cases; user JWT = own).
verify_jwt = false

[functions.analyze-case]
verify_jwt = false

[functions.stripe-webhook]
# Stripe has no Supabase JWT — signature header is the only auth.
# A deploy without this (or without --no-verify-jwt) returns 401 and
# silently drops paid checkout fulfillment.
verify_jwt = false
